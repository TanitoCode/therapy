<?xml version="1.0" encoding="UTF-8"?>
<!--
  Therapy — logo-mono-black.svg
  Wordmark monocromático #1C1917 — para impresión en negro, grabado, bordado
  USO: impresión un color, documentos, fax, borrador
  Tipografía: Fraunces italic 300 opsz:144
  NOTA: interior del símbolo usa blanco — se asume fondo blanco/papel
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 480 110"
  width="480"
  height="110"
  role="img"
  aria-label="Therapy"
>
  <title>Therapy</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&amp;display=swap');
      .wm {
        font-family: 'Fraunces', 'Georgia', 'Times New Roman', serif;
        font-style: italic;
        font-weight: 300;
        font-variation-settings: 'opsz' 144;
        font-size: 72px;
        letter-spacing: -0.02em;
        fill: #1C1917;
      }
    </style>
  </defs>

  <!-- Símbolo gestual monocromático -->
  <g transform="translate(10, 12)" aria-hidden="true">
    <path
      d="M 14 3
         C 26 3, 36 16, 35 34
         C 34 51, 24 66, 14 72
         C 5 66, -3 51, -3 34
         C -3 16, 4 3, 14 3
         Z"
      fill="#1C1917"
    />
    <!-- Interior blanco — recorte de la forma para crear el arco hueco -->
    <path
      d="M 14 12
         C 21 12, 28 22, 27 34
         C 26 46, 20 59, 14 64
         C 9 59, 5 46, 5 34
         C 5 22, 9 12, 14 12
         Z"
      fill="white"
    />
    <circle cx="14" cy="3" r="2.5" fill="#1C1917" opacity="0.5"/>
  </g>

  <!-- Divisor vertical -->
  <line x1="64" y1="22" x2="64" y2="94" stroke="#1C1917" stroke-width="0.6" opacity="0.2"/>

  <!-- Wordmark -->
  <text x="78" y="89" class="wm">Therapy</text>
</svg>
