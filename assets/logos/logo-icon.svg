<?xml version="1.0" encoding="UTF-8"?>
<!--
  Therapy — logo-icon.svg
  Isotipo standalone: símbolo gestual caligráfico
  Terracota #B85C38 — para favicon, avatar, app icon, redes sociales
  Fondo transparente — usar sobre #FAF8F5 o #1C1917
  ViewBox: 80x80
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 80 80"
  width="80"
  height="80"
  role="img"
  aria-label="Therapy"
>
  <title>Therapy</title>

  <!--
    Símbolo gestual: arco caligráfico de peso variable, centrado en 80x80
    Arco oval asimétrico — más ancho en el centro, adelgaza en los extremos
    Evoca un trazo de pincel o movimiento corporal fluido
  -->
  <g transform="translate(26, 6)">
    <!-- Arco caligráfico — forma rellena exterior -->
    <path
      d="M 14 3
         C 26 3, 36 16, 35 34
         C 34 51, 24 66, 14 72
         C 5 66, -3 51, -3 34
         C -3 16, 4 3, 14 3
         Z"
      fill="#B85C38"
    />
    <!-- Interior blanco — crea efecto de pincelada -->
    <path
      d="M 14 12
         C 21 12, 28 22, 27 34
         C 26 46, 20 59, 14 64
         C 9 59, 5 46, 5 34
         C 5 22, 9 12, 14 12
         Z"
      fill="#FAF8F5"
    />
    <!-- Punto superior de acento -->
    <circle cx="14" cy="3" r="2.8" fill="#B85C38" opacity="0.65"/>
  </g>
</svg>
